name: energize_mobile
description: "Energize Logistics — التطبيق الميداني: المهام، الخدمة الذاتية، الموافقات."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  # HTTP client — talks to the same api.energize-logistics.com the web uses.
  http: ^1.2.0
  # JWTs live in the platform keychain, never in plain prefs.
  flutter_secure_storage: ^9.2.2
  # Same socket.io the web listens on — live board updates.
  socket_io_client: ^2.0.3+1
  # State management (auth session + boards).
  provider: ^6.1.2
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
