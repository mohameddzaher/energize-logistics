name: Deploy backend to VPS

# Auto-deploys the backend to the Hostinger VPS whenever backend code lands on
# main. (The frontend deploys itself via Netlify.) So a single `git push` updates
# both halves of production.
on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch: {} # allow manual runs from the Actions tab

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H 152.239.127.46 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Rsync backend to the server
        # No --delete, and .env/uploads excluded, so the server's secrets and
        # uploaded files are never touched.
        run: |
          rsync -az \
            --exclude '.git' --exclude 'node_modules' --exclude '.env' --exclude 'uploads' --exclude '*.log' \
            -e "ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=no" \
            backend/ root@152.239.127.46:/opt/energize/backend/

      - name: Install deps and restart
        run: |
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=no root@152.239.127.46 \
            'cd /opt/energize/backend && npm install --omit=dev --no-audit --no-fund && pm2 restart energize-api --update-env && pm2 save'

      - name: Health check
        run: |
          # The app takes a few seconds to bind after pm2 restart — poll for up to
          # ~40s instead of a single early check (which false-failed on timing).
          for i in $(seq 1 8); do
            sleep 5
            code=$(curl -s -o /dev/null -w "%{http_code}" https://api.energize-logistics.com/api/ls2/dashboard)
            echo "attempt $i: HTTP $code"
            if [ "$code" = "401" ] || [ "$code" = "200" ]; then echo "✓ API healthy"; exit 0; fi
          done
          echo "Health check failed after retries" && exit 1
