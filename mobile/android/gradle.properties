# Memory for the Android build. The Flutter template gave Gradle up to 8 GB heap
# + 4 GB metaspace on a 16 GB Mac: every APK build pushed macOS to kill the
# VS Code window ("renderer process gone (reason: killed, code: 9)" → "Reopen").
# 3 GB builds this app fine; idle daemons exit after 10 minutes.
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.daemon.idletimeout=600000
kotlin.daemon.jvmargs=-Xmx1G
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
