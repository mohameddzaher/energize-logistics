# ── الموقعُ على خادمنا — بديلُ Netlify ───────────────────────────────────────
#
# يُنصَّب بـ `scripts/install-web-nginx.sh`. وهو هنا في المستودع لا على الخادم
# وحدَه: البلوكُ الذي كان مكتوبًا هناك بيدٍ حمل عطبًا صامتًا — كُتب عبر heredoc
# غير مُقتبَسٍ فخرجت متغيّراتُه مهروبةً (`\$host`)، و nginx يقرأ `\$` دولارًا
# حرفيًّا فيمرّر النصَّ «$host» ترويسةً بدل اسم المضيف. و `nginx -t` يعدّي.
# فلا يُكتَب إعدادٌ على الخادم بعد اليوم إلّا من ملفٍّ هنا.
#
# والترافيكُ كلُّه يأتي من Cloudflare، فالشهادةُ شهادةُ أصلٍ منها (Origin CA):
# تُصدَر من اللوحة بلا تحدٍّ ولا تغييرِ DNS، فلا تنقطع الخدمةُ أثناء التحويل.

# www ← الجذر. كان Netlify يفعلها؛ فإن لم تُكتَب هنا بقي www بلا جواب.
server {
    # nginx 1.24 على هذا الخادم، و«http2 on;» تعليمةُ 1.25.1 وما بعدها — تُرفَض
    # هنا بـ unknown directive. و ipv6only لا تُكتَب: بلوكُ الـAPI أخذها، وهي
    # لا تُضبَط إلّا مرّةً واحدةً لكلّ عنوانٍ ومنفذ.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.energize-logistics.com;

    ssl_certificate     /etc/ssl/cloudflare/energize-logistics.com.pem;
    ssl_certificate_key /etc/ssl/cloudflare/energize-logistics.com.key;

    return 301 https://energize-logistics.com$request_uri;
}

server {
    # nginx 1.24 على هذا الخادم، و«http2 on;» تعليمةُ 1.25.1 وما بعدها — تُرفَض
    # هنا بـ unknown directive. و ipv6only لا تُكتَب: بلوكُ الـAPI أخذها، وهي
    # لا تُضبَط إلّا مرّةً واحدةً لكلّ عنوانٍ ومنفذ.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name energize-logistics.com;

    ssl_certificate     /etc/ssl/cloudflare/energize-logistics.com.pem;
    ssl_certificate_key /etc/ssl/cloudflare/energize-logistics.com.key;

    # عنوانُ الزائر الحقيقيّ خلف Cloudflare — وإلّا صار كلُّ زائرٍ عنوانَ حاسوبٍ
    # لـCloudflare في السجلّ وفي حدود المعدّل.
    include /etc/nginx/cloudflare-real-ip.conf;

    client_max_body_size 25m;
    keepalive_timeout 75s;

    # ── ولا بلوكَ خاصًّا لملفّات Next الثابتة ────────────────────────────────
    # كان هنا بلوكٌ يضيف `Cache-Control: immutable` لـ/_next/static. و Next
    # يضيفها بنفسه، فخرجت الترويسةُ **مرّتين** في الجواب — وتكرارُها يلتبس على
    # بعض الوسطاء. وأسماءُ تلك الملفّات تحمل بصمةَ محتواها فهي مخزَّنةٌ إلى
    # الأبد بأمرٍ من Next، ويخدمها `location /` كما يخدم غيرَها. فالبلوكُ
    # كان زيادةً تُخطئ، لا تسريعًا.

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        # ── ولا ترقيةَ اتّصالٍ هنا ───────────────────────────────────────────
        # كان `$connection_upgrade` مضبوطًا على كلّ المسارات، فيصل Next طلبٌ
        # عاديٌّ ومعه ترويسةُ ترقيةٍ فارغة فيغلق الاتّصال. والمقبسُ لا يمرّ من
        # هنا أصلًا: الواجهةُ تناديه على api.energize-logistics.com (راجع
        # `lib/socket.ts`)، فكان بلوكُ /socket.io/ على المنفذ 3000 بابًا لا
        # أحدَ خلفه. وإبقاءُ "" يفتح إبقاءَ الاتّصال إلى Next.
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # ── والبروتوكولُ مكتوبٌ لا مُستنتَج ──────────────────────────────────
        # Cloudflare يُنهي TLS عند حافّته، فلو قيل لـNext «http» بنى روابطَه
        # المطلقةَ على http ودار المتصفّحُ في إعادةِ توجيهٍ لا تنتهي. وكلُّ ما
        # يصل هذا البلوكَ إنّما وصل على 443، والمنفذُ 80 يُحوَّل قبلَه. فهي
        # https يقينًا — وقراءةُ ترويسةِ CF-Visitor تحتاج `map` في سياق http
        # وتُخطئ إن غابت الترويسة، والمكتوبُ هنا أصدقُ منها.
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        proxy_connect_timeout 30s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name energize-logistics.com www.energize-logistics.com;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://energize-logistics.com$request_uri; }
}
