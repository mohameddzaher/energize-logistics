name: energize_mobile
description: "Energize Logistics — التطبيق الميداني: المهام، الخدمة الذاتية، الموافقات."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  # HTTP client — talks to the same api.energize-logistics.com the web uses.
  http: ^1.2.0
  # JWTs live in the platform keychain, never in plain prefs.
  flutter_secure_storage: ^9.2.2
  # Same socket.io the web listens on — live board updates.
  socket_io_client: ^2.0.3+1
  # State management (auth session + boards).
  provider: ^6.1.2
  intl: ^0.19.0
  # خط عربي احترافي (Tajawal) — يُحمَّل ويُخزَّن تلقائيًا.
  google_fonts: ^6.2.1
  # فتح المكالمة/الواتساب من داخل التطبيق (tel: و wa.me).
  url_launcher: ^6.3.1
  # طباعة/مشاركة PDF من داخل التطبيق (البوليصة وغيرها) — يدعم العربية عبر خطوط جوجل.
  printing: ^5.13.1
  pdf: ^3.11.1
  # إشعارات محلية بصوت تظهر في مركز الإشعارات (مجاني، بدون Apple Developer للأندرويد).
  flutter_local_notifications: ^17.2.3
  # اختيار الملفات لرفع المستندات (مستندات الموظف، المرفقات) كـ base64.
  file_picker: ^8.1.6
  # خرائط GPS (OpenStreetMap — مجاني بلا مفتاح API) لمسار المركبات في لوكيشن سوليوشن.
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

# أيقونة التطبيق — لوجو الشركة على خلفية كحلية (نفس هوية الموقع).
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/icon.png
  adaptive_icon_background: "#081833"
  adaptive_icon_foreground: assets/icon_fg.png

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/logo_white.png
